<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Desktop / Responsive Viewport Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blessings Buildwell | Crafting Luxury, Building Dreams</title>
  
  <style>
    :root {
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-dark: #AA820A;
      --navy-bg: #070D18;
      --navy-card: #0F1B2E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-bg);
      color: #FFFFFF;
      font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      width: 100%;
      padding: 25px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      background: rgba(15, 27, 46, 0.6);
      backdrop-filter: blur(10px);
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo-wrap svg {
      width: 60px;
      height: 60px;
      filter: drop-shadow(0px 0px 8px rgba(212, 175, 55, 0.5));
    }

    .brand-title-text {
      color: var(--gold);
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Main Hero Banner Section */
    .hero-container {
      text-align: center;
      margin-top: 40px;
      padding: 0 20px;
    }

    .main-logo-hero {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      animation: logoGlow 3s ease-in-out infinite alternate;
    }

    .hero-title {
      font-size: 2.8rem;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .hero-subtitle {
      color: var(--gold-light);
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.9;
    }

    /* Architectural Building Animation Section */
    .building-skyline {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      height: 280px;
      margin: 40px auto 0;
      padding-bottom: 1px;
      border-bottom: 2px solid var(--gold);
      position: relative;
    }

    .building {
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.85) 0%, rgba(15, 27, 46, 0.95) 100%);
      border: 1px solid var(--gold);
      border-bottom: none;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      position: relative;
      transform-origin: bottom;
      animation: riseBuilding 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    /* Window Grids with Animated Lighting */
    .building::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 15%;
      right: 15%;
      bottom: 10px;
      background-image: radial-gradient(var(--gold-light) 25%, transparent 25%);
      background-size: 10px 16px;
      opacity: 0.8;
    }

    /* Staggered Heights and Animation Delays */
    .b1 { width: 45px; height: 130px; animation-delay: 0.1s; }
    .b2 { width: 55px; height: 190px; animation-delay: 0.4s; }
    .b3 { width: 65px; height: 250px; animation-delay: 0.7s; } /* Center Spire Tower */
    .b4 { width: 55px; height: 170px; animation-delay: 0.3s; }
    .b5 { width: 45px; height: 110px; animation-delay: 0.2s; }

    /* Center Tower Spire Peak */
    .b3::after {
      content: '';
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 28px solid var(--gold);
    }

    /* Keyframe Animations */
    @keyframes riseBuilding {
      0% {
        transform: scaleY(0);
        opacity: 0;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes logoGlow {
      from {
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
      }
      to {
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.8));
      }
    }

    /* Footer */
    footer {
      width: 100%;
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: rgba(243, 229, 171, 0.6);
      border-top: 1px solid rgba(212, 175, 55, 0.15);
    }
  </style>
</head>
